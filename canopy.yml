project: canopy-code
source: "canopy"
module_depth: 2

layers:
  core:
    modules: ["cli", "models", "config", "exceptions", "aggregator", "score", "cycles", "history"]
    label: Core
  collectors:
    modules: ["collectors"]
    label: Collectors
  layout:
    modules: ["layout"]
    label: Layout
  render:
    modules: ["render"]
    label: Render

vulture:
  min_confidence: 60
  exclude_types: ["attribute"]

git:
  churn_days: 30

thresholds:
  score_healthy: 75
  score_moderate: 50
  risk_hotspot: 0.4
  min_loc: 10

output:
  path: docs/canopy.svg
  width: 1000
  height: 800

ignore:
  - "tests/**"
  - "docs/**"
  - "**/__pycache__/**"
